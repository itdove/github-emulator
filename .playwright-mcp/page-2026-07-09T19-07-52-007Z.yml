        - generic [ref=e74]: "## Summary Implements the core `rhai-cli diagnose` subcommand with P0 health checks against live RHOAI clusters: - **Operator health**: Verifies rhods-operator pod status and OLM ClusterServiceVersion phase - **Platform CR conditions**: Inspects DataScienceCluster and DSCInitialization CR conditions for degraded/progressing states - **Component readiness**: Validates Ready condition for managed components (dashboard, model-controller, workbenches, data-science-pipelines, model-registry) - **RBAC pre-checks**: SelfSubjectAccessReview-based permission validation before running checks - **Structured output**: JSON and human-readable text output with exit code gating (0=pass, 1=fail) - **Pluggable registry**: DiagnoseRegistry pattern for extensible health check registration Also includes dependency changes from RHAI-4 (version mismatch detection) and RHAI-3 (route/TLS validation with remediation hints). ## Review Scores | Dimension | Score | Weight | |-----------|-------|--------| | Architecture | 9.0 | 30% | | Tests | 8.0 | 30% | | Lint | 9.0 | 20% | | Intent | 9.0 | 20% | | **Weighted Average** | **8.7** | **Pass** | ## Test Plan - [ ] Verify `rhai-cli diagnose` runs all registered health checks against a cluster - [ ] Verify `rhai-cli diagnose --output json` produces valid JSON envelope output - [ ] Verify non-zero exit code when critical checks fail - [ ] Verify RBAC pre-check reports missing permissions gracefully - [ ] Verify existing `status`, `lint`, and `components` commands remain unchanged - [ ] Run `go test ./pkg/diagnose/...` and `go test ./pkg/lint/checks/platform/version/...` Generated by epic-codegen | Score: 8.7/10 (pass) ## Description <!-- What does this PR do? --> ## Testing - [ ] Unit tests pass (`make test`) - [ ] Linter passes (`make lint`) - [ ] New functionality includes tests ## Review checklist - [ ] Code follows project conventions (see docs/coding/) - [ ] Changes are documented if needed"
